<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AutoCar 컨트롤러</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14161a;
    color: #f2f2f2;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  }

  .container {
    text-align: center;
    padding: 32px;
  }

  h1 {
    margin: 0 0 16px;
    font-size: 1.5rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #1f2228;
    font-size: 0.9rem;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #777;
  }
  .status-dot.ok { background: #3ddc84; }
  .status-dot.error { background: #e5484d; }

  .pad {
    display: grid;
    grid-template-columns: 84px 84px 84px;
    grid-template-rows: 84px 84px 84px;
    gap: 12px;
    justify-content: center;
    margin: 0 auto;
  }

  .btn {
    border: none;
    border-radius: 16px;
    background: #23262d;
    color: #f2f2f2;
    font-size: 1.8rem;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s, transform 0.1s;
  }

  .btn:hover { background: #2c3038; }
  .btn.active {
    background: #4a7dff;
    transform: scale(0.95);
  }

  .btn-forward  { grid-column: 2; grid-row: 1; }
  .btn-left     { grid-column: 1; grid-row: 2; }
  .btn-stop     { grid-column: 2; grid-row: 2; background: #3a1f24; }
  .btn-stop:hover { background: #4a2227; }
  .btn-stop.active { background: #e5484d; }
  .btn-right    { grid-column: 3; grid-row: 2; }
  .btn-backward { grid-column: 2; grid-row: 3; }

  .hint {
    margin-top: 22px;
    font-size: 0.85rem;
    color: #9a9ea7;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🚗 AutoCar 컨트롤러</h1>

    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">준비 중...</span>
    </div>

    <div class="pad">
      <button class="btn btn-forward" data-dir="forward">▲</button>
      <button class="btn btn-left" data-dir="left">◀</button>
      <button class="btn btn-stop" data-dir="stop">■</button>
      <button class="btn btn-right" data-dir="right">▶</button>
      <button class="btn btn-backward" data-dir="backward">▼</button>
    </div>

    <p class="hint">
      버튼을 누르고 있거나 키보드 방향키(↑ ↓ ← →)를 사용하세요.<br>
      손을 떼면 자동으로 정지합니다.
    </p>
  </div>

<script>
  const KEY_TO_DIR = {
    ArrowUp: "forward",
    ArrowDown: "backward",
    ArrowLeft: "left",
    ArrowRight: "right",
  };

  const pressedKeys = new Set();
  let activeDirection = null;

  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  const LABEL = {
    forward: "전진", backward: "후진", left: "좌회전", right: "우회전", stop: "정지",
  };

  function setStatus(text, ok) {
    statusText.textContent = text;
    statusDot.classList.toggle("ok", ok === true);
    statusDot.classList.toggle("error", ok === false);
  }

  async function sendCommand(direction) {
    try {
      const res = await fetch(`/move/${direction}`, { method: "POST" });
      if (!res.ok) throw new Error("request failed");
      setStatus(LABEL[direction] ?? direction, true);
    } catch (err) {
      setStatus("연결 오류", false);
    }
  }

  function highlight(direction, on) {
    document.querySelectorAll(".btn").forEach((btn) => {
      if (btn.dataset.dir === direction) btn.classList.toggle("active", on);
    });
  }

  function startMove(direction) {
    if (direction === activeDirection) return;
    if (activeDirection) highlight(activeDirection, false);
    activeDirection = direction;
    highlight(direction, true);
    sendCommand(direction);
  }

  function stopMove() {
    if (!activeDirection) return;
    highlight(activeDirection, false);
    activeDirection = null;
    sendCommand("stop");
  }

  // 버튼: 마우스 / 터치
  document.querySelectorAll(".btn").forEach((btn) => {
    const dir = btn.dataset.dir;

    if (dir === "stop") {
      btn.addEventListener("click", () => sendCommand("stop"));
      return;
    }

    const press = (e) => { e.preventDefault(); startMove(dir); };
    const release = (e) => { e.preventDefault(); stopMove(); };

    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
    btn.addEventListener("mouseleave", release);
    btn.addEventListener("touchstart", press, { passive: false });
    btn.addEventListener("touchend", release);
  });

  // 키보드 방향키
  window.addEventListener("keydown", (e) => {
    const dir = KEY_TO_DIR[e.key];
    if (!dir || pressedKeys.has(e.key)) return;
    pressedKeys.add(e.key);
    startMove(dir);
  });

  window.addEventListener("keyup", (e) => {
    const dir = KEY_TO_DIR[e.key];
    if (!dir) return;
    pressedKeys.delete(e.key);
    if (pressedKeys.size === 0) {
      stopMove();
    } else {
      const nextKey = [...pressedKeys].pop();
      startMove(KEY_TO_DIR[nextKey]);
    }
  });

  setStatus("준비 완료", true);
</script>
</body>
</html>
