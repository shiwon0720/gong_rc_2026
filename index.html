<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오시원 - 소개</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9e9e9;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }

  .frame {
    position: relative;
    width: 1000px;
    max-width: 92vw;
    aspect-ratio: 16 / 9;
    background: #16263a;
    padding: 22px;
    border-radius: 4px;
    overflow: hidden;
  }

  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    background: #c79a45;
    z-index: 1;
  }

  .frame::before {
    top: -90px;
    right: -90px;
    transform: rotate(45deg);
  }

  .frame::after {
    bottom: -90px;
    left: -90px;
    transform: rotate(45deg);
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 2px;
    padding: 5% 7%;
  }

  h1 {
    color: #c79a45;
    font-size: 2.4rem;
    font-weight: 700;
    margin: 0 0 1.8em 0;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    position: relative;
    padding-left: 1.4em;
    margin-bottom: 0.55em;
    font-size: 1.05rem;
    color: #1b2a3d;
  }

  li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #1b2a3d;
  }

  li .label {
    display: inline-block;
    width: 5.5em;
  }

  li .colon {
    margin-right: 0.4em;
  }

  li a {
    color: #1b2a3d;
    text-decoration: none;
  }

  li a:hover {
    text-decoration: underline;
  }

  .value {
    font-weight: 700;
    color: #1b2a3d;
  }

  .gap {
    margin-top: 1.6em;
  }

  .section-link {
    font-weight: 700;
  }

  @media (max-width: 700px) {
    h1 { font-size: 1.6rem; }
    li { font-size: 0.85rem; }
    .frame { padding: 14px; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="card">
      <h1>이름: 오시원</h1>

      <ul>
        <li><span class="label">GitHub</span><span class="colon">:</span><a href="https://github.com/shiwon0720" target="_blank">https://github.com/shiwon0720</a></li>
        <li><span class="label">사는곳</span><span class="colon">:</span><span class="value">전라북도 전주</span></li>
        <li><span class="label">출생년도</span><span class="colon">:</span><span class="value">2004년</span></li>
        <li><span class="label">MBTI</span><span class="colon">:</span><span class="value">INFP</span></li>
        <li><span class="label">자기소개</span><span class="colon">:</span><span class="value">안녕하세요!</span></li>
      </ul>

      <ul class="gap">
        <li><a class="section-link" href="#" target="_blank">팀원(1차)</a></li>
        <li><a class="section-link" href="#" target="_blank">팀 레포지토리</a></li>
      </ul>
    </div>
  </div>

</body>
</html>
