<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오시원 - 소개</title>
<style>
  :root {
    --navy: #16263a;
    --navy-light: #1b2a3d;
    --gold: #c79a45;
    --gold-light: #e0bd72;
    --bg: #f3f1ec;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    background: var(--bg);
    color: var(--navy-light);
    line-height: 1.6;
  }

  header.hero {
    position: relative;
    background: var(--navy);
    color: #fff;
    padding: 90px 8% 70px;
    overflow: hidden;
  }

  header.hero::before {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    background: var(--gold);
    top: -140px;
    right: -100px;
    transform: rotate(45deg);
    opacity: 0.95;
  }

  header.hero::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    background: var(--gold);
    bottom: -120px;
    left: -80px;
    transform: rotate(45deg);
    opacity: 0.6;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 760px;
  }

  .hero-content .eyebrow {
    color: var(--gold-light);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
